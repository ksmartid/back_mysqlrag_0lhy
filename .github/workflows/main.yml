name: Build test publish and request deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.repository == 'ksmartid/front_mysqlrag_0lhy' ||
       github.repository == 'ksmartid/back_mysqlrag_0lhy')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: hyoung814/${{ github.event.repository.name }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select service
        id: target
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$GITHUB_REPOSITORY" in
            ksmartid/front_mysqlrag_0lhy) service=frontend; port=80; path=/ ;;
            ksmartid/back_mysqlrag_0lhy) service=backend; port=8000; path=/health ;;
            *) exit 2 ;;
          esac
          printf 'service=%s\nport=%s\npath=%s\n' "$service" "$port" "$path" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          platforms: linux/amd64
          build-args: |
            VITE_API_BASE=/api

      - name: Container smoke test
        env:
          SERVICE: ${{ steps.target.outputs.service }}
          PORT: ${{ steps.target.outputs.port }}
          TEST_PATH: ${{ steps.target.outputs.path }}
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'docker logs ci-smoke || true; docker rm -f ci-smoke || true' EXIT
          docker run -d --name ci-smoke \
            -p "127.0.0.1:18090:${PORT}" "$IMAGE"
          ready=false
          for attempt in {1..30}; do
            if [[ "$(docker inspect -f '{{.State.Running}}' ci-smoke)" != true ]]; then
              echo 'Smoke container stopped.' >&2
              exit 1
            fi
            if curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
              "http://127.0.0.1:18090${TEST_PATH}" > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == true ]]
          if [[ "$SERVICE" == backend ]]; then
            docker exec ci-smoke python -m compileall -q app
          else
            docker exec ci-smoke nginx -t
          fi

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'hyoung814' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish tested image
        shell: bash
        run: docker push "$IMAGE"

      - name: Request private repository deployment
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          SERVICE: ${{ steps.target.outputs.service }}
          TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_TOKEN"
          body=$(jq -n \
            --arg event "deploy-$SERVICE" \
            --arg tag "$TAG" \
            --arg repo "$GITHUB_REPOSITORY" \
            '{event_type:$event,client_payload:{image_tag:$tag,source_repository:$repo}}')
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/ksmartid/rag_mysqlrag_deploy/dispatches \
            -d "$body"
