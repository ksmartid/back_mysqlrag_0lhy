name: Build test publish and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.repository == 'ksmartid/back_mysqlrag_0lhy' ||
       github.repository == 'ksmartid/front_mysqlrag_0lhy')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare release
        id: prepare
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s Dockerfile || {
            echo "Dockerfile is missing from this commit" >&2
            exit 1
          }

          case "$GITHUB_REPOSITORY" in
            ksmartid/back_mysqlrag_0lhy)
              service=backend
              port=8000
              path=/health
              ;;
            ksmartid/front_mysqlrag_0lhy)
              service=frontend
              port=80
              path=/
              ;;
          esac

          tag="v${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="hyoung814/${GITHUB_REPOSITORY##*/}:$tag"

          printf 'SERVICE=%s\nPORT=%s\nTEST_PATH=%s\nTAG=%s\nIMAGE=%s\n' \
            "$service" "$port" "$path" "$tag" "$image" >> "$GITHUB_ENV"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          echo "Release image: $image"

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            ${{ env.SERVICE == 'frontend' && 'VITE_API_BASE=/api' || '' }}

      - name: Container smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'docker logs --tail 80 ci-smoke || true; docker rm -f ci-smoke || true' EXIT

          docker run -d --name ci-smoke \
            -p "127.0.0.1:18090:$PORT" "$IMAGE"

          ready=false
          for attempt in {1..30}; do
            if [[ "$(docker inspect -f '{{.State.Running}}' ci-smoke)" != true ]]; then
              echo "Smoke container stopped" >&2
              exit 1
            fi
            if curl -fsS --connect-timeout 2 --max-time 5 \
              "http://127.0.0.1:18090$TEST_PATH" > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == true ]]

          if [[ "$SERVICE" == backend ]]; then
            docker exec ci-smoke python -m compileall -q app
          else
            docker exec ci-smoke nginx -t
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: hyoung814
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish tested image
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          docker push "$IMAGE"
          repository="${IMAGE%:*}"
          reference=$(docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' |
            jq -er --arg prefix "$repository@sha256:" \
              '[.[] | select(startswith($prefix))][0]')
          digest="${reference##*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Published %s (%s)\n' "$IMAGE" "$digest"

  deploy:
    needs: build
    runs-on:
      - self-hosted
      - linux
      - x64
      - ${{ github.repository == 'ksmartid/back_mysqlrag_0lhy' && 'rag-back' || 'rag-front' }}
    timeout-minutes: 15
    steps:
      - name: Pull and deploy verified image
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          case "$GITHUB_REPOSITORY" in
            ksmartid/back_mysqlrag_0lhy)
              container=back-mysqlrag
              server_ip=10.0.2.11
              port=8000
              probe=/health
              env_file=/home/ubuntu/back-gitaction-cicd/back_mysqlrag_0lhy/.env
              test -r "$env_file"
              grep -qE '^PG_DSN=.+$' "$env_file"
              run_args=(--network host --env-file "$env_file")
              ;;
            ksmartid/front_mysqlrag_0lhy)
              container=front-mysqlrag
              server_ip=10.0.2.10
              port=80
              probe=/
              run_args=(--publish "$server_ip:80:80")
              ;;
            *) exit 1 ;;
          esac

          # Refuse deployment on a runner registered on the wrong machine.
          ip -o -4 addr show | awk '{split($4, a, "/"); print a[1]}' |
            grep -Fxq "$server_ip"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          repository="hyoung814/${GITHUB_REPOSITORY##*/}"
          image="$repository@$IMAGE_DIGEST"
          backup="$container-rollback"

          # Shares the lock with the existing manual deployment scripts.
          exec 9>"/home/ubuntu/$container.deploy.lock"
          flock -w 60 9
          if docker container inspect "$backup" >/dev/null 2>&1; then
            echo "Inspect the existing rollback container: $backup" >&2
            exit 1
          fi

          saved_old=0
          created_new=0
          old_running=false
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)

          finish() {
            status=$?
            trap - EXIT INT TERM
            set +e
            if (( status != 0 )); then
              if (( created_new )); then
                docker logs --tail 80 "$container" >&2
                docker rm -f "$container" || echo "New container cleanup failed" >&2
              fi
              if (( saved_old )); then
                if docker rename "$backup" "$container"; then
                  if [[ "$old_running" == true ]]; then
                    docker start "$container" || echo "Rollback restart failed" >&2
                  fi
                else
                  echo "Rollback rename failed: $backup" >&2
                fi
              fi
            fi
            rm -rf -- "$DOCKER_CONFIG"
            exit "$status"
          }
          trap finish EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_TOKEN" |
            docker login --username hyoung814 --password-stdin
          unset DOCKERHUB_TOKEN
          docker pull "$image"
          revision=$(docker image inspect "$image" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          [[ "$revision" == "$SOURCE_SHA" ]]

          if docker container inspect "$container" >/dev/null 2>&1; then
            old_running=$(docker inspect -f '{{.State.Running}}' "$container")
            docker rename "$container" "$backup"
            saved_old=1
            if [[ "$old_running" == true ]]; then
              docker stop "$backup"
            fi
          fi

          if [[ -n "$(ss -H -ltn "sport = :$port")" ]]; then
            echo "Port $port is occupied by another service" >&2
            ss -ltnp "sport = :$port" >&2
            exit 1
          fi

          docker create --name "$container" --restart unless-stopped \
            "${run_args[@]}" "$image"
          created_new=1
          docker start "$container"

          ready=false
          for attempt in {1..30}; do
            if [[ "$(docker inspect -f '{{.State.Running}}' "$container")" != true ]]; then
              break
            fi
            if curl -fsS --connect-timeout 2 --max-time 3 \
              "http://$server_ip:$port$probe" >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == true ]]

          # Local numbered alias for convenient inspection.
          docker tag "$image" "$repository:$RELEASE_TAG"
          if (( saved_old )); then
            docker rm "$backup"
          fi
          saved_old=0
          created_new=0
          printf 'Deployed %s:%s to %s:%s\n' \
            "$repository" "$RELEASE_TAG" "$server_ip" "$port" >> "$GITHUB_STEP_SUMMARY"
