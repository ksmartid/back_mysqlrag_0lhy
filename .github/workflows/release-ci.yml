name: Publish numbered Docker release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.repository == 'ksmartid/back_mysqlrag_0lhy' ||
       github.repository == 'ksmartid/front_mysqlrag_0lhy')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare release
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s Dockerfile || {
            echo "Dockerfile is missing from this commit" >&2
            exit 1
          }

          case "$GITHUB_REPOSITORY" in
            ksmartid/back_mysqlrag_0lhy)
              service=backend
              port=8000
              path=/health
              ;;
            ksmartid/front_mysqlrag_0lhy)
              service=frontend
              port=80
              path=/
              ;;
          esac

          tag="v$((GITHUB_RUN_NUMBER + 4))"
          image="hyoung814/${GITHUB_REPOSITORY##*/}:$tag"

          printf 'SERVICE=%s\nPORT=%s\nTEST_PATH=%s\nTAG=%s\nIMAGE=%s\n' \
            "$service" "$port" "$path" "$tag" "$image" >> "$GITHUB_ENV"
          echo "Release image: $image"

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            ${{ env.SERVICE == 'frontend' && 'VITE_API_BASE=/api' || '' }}

      - name: Container smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'docker logs --tail 80 ci-smoke || true; docker rm -f ci-smoke || true' EXIT

          docker run -d --name ci-smoke \
            -p "127.0.0.1:18090:$PORT" "$IMAGE"

          ready=false
          for attempt in {1..30}; do
            if [[ "$(docker inspect -f '{{.State.Running}}' ci-smoke)" != true ]]; then
              echo "Smoke container stopped" >&2
              exit 1
            fi
            if curl -fsS --connect-timeout 2 --max-time 5 \
              "http://127.0.0.1:18090$TEST_PATH" > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == true ]]

          if [[ "$SERVICE" == backend ]]; then
            docker exec ci-smoke python -m compileall -q app
          else
            docker exec ci-smoke nginx -t
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: hyoung814
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish tested image
        shell: bash
        run: docker push "$IMAGE"

      - name: Request deployment
        shell: bash
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_TOKEN"

          body=$(jq -n \
            --arg event "deploy-$SERVICE" \
            --arg tag "$TAG" \
            --arg source "$GITHUB_REPOSITORY" \
            '{event_type:$event,client_payload:{image_tag:$tag,source_repository:$source}}')

          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/ksmartid/rag_mysqlrag_deploy/dispatches \
            -d "$body"
